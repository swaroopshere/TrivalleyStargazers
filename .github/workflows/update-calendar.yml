name: Update Calendar Data

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at 00:00 UTC every day
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check calendar normalization
        run: node --test scripts/public-calendar.test.cjs

      - name: Update calendar data
        run: npm run build

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add calendar-data.json tvs-deploy/calendar-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update calendar data" && git push)
